name: genyo-crud-employers

services:
  mongodb:
    image: mongo:7
    container_name: genyo-crud-employers-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-employers_db}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: genyo-crud-employers-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3800}:3800"
    env_file:
      - ./backend/.env
    environment:
      MONGO_HOST: mongodb
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  app:
    build:
      context: ./app
    container_name: genyo-crud-employers-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  mongo_data:
